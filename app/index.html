<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BufferX</title>
    <meta name="description" content="ISO 8583 and banking cryptography workbench" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Applied before first paint so the shell never flashes the wrong theme.
      // Reads the same key the settings store writes.
      (function () {
        try {
          var stored = localStorage.getItem('bufferx.theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.dataset.theme = theme
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
