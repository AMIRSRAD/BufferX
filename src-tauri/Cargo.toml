[package]
name = "bufferx"
version = "2.0.0"
description = "ISO 8583 and banking cryptography workbench"
authors = ["Amirsalar Saberi rad"]
edition = "2021"
rust-version = "1.77"

[lib]
# Tauri v2 builds the app as a library so mobile targets can reuse it.
name = "bufferx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cmake = "0.1"

[dependencies]
# No `protocol-asset`: nothing is loaded from disk by URL. Files reach the UI
# only through the host commands, which is also what the WebAssembly build has
# to do, so the two stay behaviourally identical.
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
